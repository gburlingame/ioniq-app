<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
<meta property="og:image" content="{{ '/assets/images/app-icon.png' | absolute_url }}">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">

<!-- Match the landing page's typography across the docs pages -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Site-wide typography to match the landing page. just-the-docs only sets a
     sans font on `body`; headings, the site title, and nav all inherit it. */
  body {
    font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  }
  pre, code, kbd, samp, .text-mono {
    font-family: 'JetBrains Mono', "SFMono-Regular", Menlo, Consolas, monospace !important;
  }
  .side-bar {
    background: #16213e !important;
    border-right: 1px solid #00d4ff33 !important;
  }
  /* Remove all white gradients everywhere */
  .site-button,
  .nav-list-link,
  .nav-list-expander,
  .site-title,
  .aux-nav-list-item a {
    background-image: none !important;
  }
  /* Hover state — dark blue */
  .site-button:hover,
  .nav-list-link:hover,
  .nav-list-expander:hover,
  .site-title:hover,
  .aux-nav-list-item a:hover {
    background-image: none !important;
    background-color: #0f3460 !important;
  }
  /* Active/current page — highlighted */
  .nav-list-link.active,
  .nav-list-item.active > .nav-list-link {
    background-image: none !important;
    background-color: #0f3460 !important;
    color: #00d4ff !important;
    font-weight: 600;
  }
  /* Hide "Just the Docs" footer */
  .site-footer {
    display: none !important;
  }
</style>
